<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Login | Jai Veera Hanuman</title><link rel="stylesheet" href="/css/admin.css"><script defer src="/js/admin-login.js"></script></head><body class="login-page"><main class="login-card"><a class="admin-brand" href="/"><img src="/assets/vhcp-logo.jpeg" alt=""><span><b>JAI VEERA HANUMAN</b><small>BUSINESS ADMINISTRATION</small></span></a><p class="eyebrow">SECURE ACCESS</p><h1>Welcome back</h1><p class="muted">Sign in to manage products, inventory and pricing.</p><form id="loginForm"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="100"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary-button" type="submit">Sign in to dashboard</button><p id="loginMessage" class="message" role="status"></p></form><details class="login-recovery"><summary>Forgot password?</summary><p class="muted">Recovery requires your admin username and the date of birth previously saved in Admin Account & Security.</p><form id="recoveryForm"><label for="recoveryUsername">Admin username</label><input id="recoveryUsername" required autocomplete="username"><label for="recoveryDob">Recovery date of birth</label><input id="recoveryDob" type="date" required><label for="recoveryPassword">New password (12+ characters)</label><input id="recoveryPassword" type="password" minlength="12" required autocomplete="new-password"><button class="outline-button" type="submit">Verify & reset password</button><p id="recoveryMessage" class="message" role="status"></p></form></details><a class="back-link" href="/">← Back to public website</a></main></body></html>
